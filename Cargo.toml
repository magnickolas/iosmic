[package]
name = "iosmic"
version = "0.1.0"
edition = "2024"

[features]
default = ["usb"]
usb = ["dep:idevice"]

[dependencies]
alsa = "0.11"
anyhow = "1"
byteorder = "1"
clap = { version = "4", features = ["derive"] }
idevice = { version = "0.1", features = ["usbmuxd"], optional = true }
libc = "0.2"
rubato = "3.0.0"
symphonia = { version = "0.6", default-features = false, features = ["aac"] }
tokio = { version = "1", features = ["full"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
